# Render Blueprint: two free Spring Boot web services backed by Neon Postgres.
# Set DATABASE_URL / DATABASE_USER / DATABASE_PASSWORD in the Render dashboard (sync: false).
services:
  - type: web
    name: cricbear-auth
    runtime: docker
    plan: free
    rootDir: CRICBEAR_Backend/userAuthorisation
    envVars: &env
      - {key: DATABASE_URL, sync: false}
      - {key: DATABASE_USER, sync: false}
      - {key: DATABASE_PASSWORD, sync: false}
      - {key: CORS_ORIGINS, value: "https://cricbear.vercel.app,https://cricbear-admin.vercel.app"}
  - type: web
    name: cricbear-tournament
    runtime: docker
    plan: free
    rootDir: CRICBEAR_Backend/tournament
    envVars: *env
